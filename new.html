<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List App</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
 
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
 
  .todo-container {
    background: #ffffff;
    width: 100%;
    max-width: 450px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow: hidden;
  }
 
  .todo-header {
    background: #1f1c2c;
    color: white;
    padding: 25px 20px;
    text-align: center;
  }
 
  .todo-header h1 {
    font-size: 24px;
    margin-bottom: 5px;
  }
 
  .todo-header p {
    font-size: 13px;
    color: #ccc;
  }
 
  .input-section {
    display: flex;
    padding: 20px;
    gap: 10px;
    border-bottom: 1px solid #eee;
  }
 
  #taskInput {
    flex: 1;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
 
  #taskInput:focus {
    border-color: #928dab;
  }
 
  #addBtn {
    background: #1f1c2c;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
    font-weight: bold;
    transition: background 0.2s;
  }
 
  #addBtn:hover {
    background: #928dab;
  }
 
  .task-list {
    list-style: none;
    max-height: 400px;
    overflow-y: auto;
  }
 
  .task-item {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #f0f0f0;
    gap: 12px;
    animation: slideIn 0.2s ease;
  }
 
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
 
  .task-checkbox {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #1f1c2c;
    flex-shrink: 0;
  }
 
  .task-text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-word;
  }
 
  .task-item.completed .task-text {
    text-decoration: line-through;
    color: #aaa;
  }
 
  .delete-btn {
    background: #ff5c5c;
    color: white;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
 
  .delete-btn:hover {
    background: #d43f3f;
  }
 
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: #fafafa;
    font-size: 13px;
    color: #777;
  }
 
  #clearCompleted {
    background: none;
    border: none;
    color: #928dab;
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }
 
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #bbb;
    font-size: 14px;
  }
</style>
</head>
<body>
 
<div class="todo-container">
  <div class="todo-header">
    <h1>📝 My To-Do List</h1>
    <p>Stay organized, stay productive</p>
  </div>
 
  <div class="input-section">
    <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100">
    <button id="addBtn">+</button>
  </div>
 
  <ul class="task-list" id="taskList"></ul>
 
  <div class="footer">
    <span id="taskCount">0 tasks left</span>
    <button id="clearCompleted">Clear completed</button>
  </div>
</div>
 
<script>
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const taskCount = document.getElementById('taskCount');
  const clearCompletedBtn = document.getElementById('clearCompleted');
 
  // Load tasks from localStorage, or start with empty array
  let tasks = JSON.parse(localStorage.getItem('todoTasks')) || [];
 
  // Save tasks to localStorage
  function saveTasks() {
    localStorage.setItem('todoTasks', JSON.stringify(tasks));
  }
 
  // Render all tasks to the page
  function renderTasks() {
    taskList.innerHTML = '';
 
    if (tasks.length === 0) {
      taskList.innerHTML = '<li class="empty-state">No tasks yet. Add one above! 🎉</li>';
    } else {
      tasks.forEach((task) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.completed ? ' completed' : '');
 
        li.innerHTML = `
          <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} data-id="${task.id}">
          <span class="task-text">${escapeHtml(task.text)}</span>
          <button class="delete-btn" data-id="${task.id}">✕</button>
        `;
 
        taskList.appendChild(li);
      });
    }
 
    updateTaskCount();
  }
 
  // Prevent HTML injection from task text
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
 
  // Update the "X tasks left" counter
  function updateTaskCount() {
    const activeTasks = tasks.filter(t => !t.completed).length;
    taskCount.textContent = `${activeTasks} task${activeTasks !== 1 ? 's' : ''} left`;
  }
 
  // Add a new task
  function addTask() {
    const text = taskInput.value.trim();
    if (text === '') return;
 
    tasks.push({
      id: Date.now(),
      text: text,
      completed: false
    });
 
    taskInput.value = '';
    saveTasks();
    renderTasks();
  }
 
  // Toggle complete/incomplete
  function toggleTask(id) {
    tasks = tasks.map(task =>
      task.id === id ? { ...task, completed: !task.completed } : task
    );
    saveTasks();
    renderTasks();
  }
 
  // Delete a task
  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    saveTasks();
    renderTasks();
  }
 
  // Clear all completed tasks
  function clearCompleted() {
    tasks = tasks.filter(task => !task.completed);
    saveTasks();
    renderTasks();
  }
 
  // Event listeners
  addBtn.addEventListener('click', addTask);
 
  taskInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addTask();
  });
 
  taskList.addEventListener('click', (e) => {
    const id = Number(e.target.dataset.id);
 
    if (e.target.classList.contains('task-checkbox')) {
      toggleTask(id);
    }
 
    if (e.target.classList.contains('delete-btn')) {
      deleteTask(id);
    }
  });
 
  clearCompletedBtn.addEventListener('click', clearCompleted);
 
  // Initial render on page load
  renderTasks();
</script>
 
</body>
</html>
